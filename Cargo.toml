[package]
name = "jsq"
version = "4.5.0"
edition = "2024"
description = "A tool for evaluating a JavaScript function and printing the result."
license = "MIT"
repository = "https://github.com/callum-oakley/jsq"

[dependencies]
anyhow = "1.0.102"
csv = "1.4.0"
json5 = "1.3.1"
serde_yaml = "0.9.34"
termcolor = "1.4.1"

[dependencies.clap]
version = "4.6.1"
features = ["derive"]

[dependencies.oxc]
version = "0.132.0"
features = ["ast_visit", "codegen"]

[dependencies.serde_json]
version = "1.0.150"
features = ["preserve_order"]

[dependencies.toml]
version = "1.1.2"
features = ["preserve_order"]

[dependencies.indexmap]
version = "2.14.0"
features = ["serde"]
